name: tests

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install espeak-ng
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng

      - name: Install dependencies
        run: npm ci

      - name: Confirm ffmpeg/ffprobe are present
        run: |
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Diagnose thumbnail generation
        run: |
          ffmpeg -hide_banner -filters | grep -i drawtext || echo "NO drawtext filter in this ffmpeg"
          node -e "import('./src/media/thumbnail.js').then(m=>{try{m.generateThumbnail('Test Title','/tmp/t.png');console.log('thumbnail OK')}catch(e){console.log('THUMBNAIL FAIL:',e.message);console.log(String(e.stderr||''))}})"

      - name: Run tests
        run: npm test
