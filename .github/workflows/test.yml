name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install ffmpeg and espeak-ng
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng

      - name: Install dependencies
        run: npm ci

      - name: Confirm required tools (fails if any is missing)
        run: |
          set -eo pipefail
          command -v ffmpeg ffprobe espeak-ng
          ffmpeg -hide_banner -filters | grep -i drawtext

      - name: Run tests
        run: npm test
