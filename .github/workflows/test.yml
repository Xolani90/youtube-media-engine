name: tests

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install ffmpeg and espeak-ng
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng

      - name: Install dependencies
        run: npm ci

      - name: Confirm required tools (fails if any is missing)
        run: |
          set -eo pipefail
          command -v ffmpeg ffprobe espeak-ng
          ffmpeg -hide_banner -filters | grep -i drawtext

      - name: Run tests
        run: npm test
