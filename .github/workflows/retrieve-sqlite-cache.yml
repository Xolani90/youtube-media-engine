name: Retrieve SQLite Cache (read-only)

on:
  workflow_dispatch: {}

permissions:
  contents: none

concurrency:
  group: retrieve-sqlite-cache
  cancel-in-progress: false

jobs:
  retrieve:
    runs-on: ubuntu-latest

    steps:
      - name: Restore exact cache entry
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/data/media-engine.db
          key: media-engine-sqlite-36628871372-1
          fail-on-cache-miss: true

      - name: Verify retrieved file
        shell: bash
        run: |
          test -f "${{ github.workspace }}/data/media-engine.db"
          wc -c "${{ github.workspace }}/data/media-engine.db"
          sha256sum "${{ github.workspace }}/data/media-engine.db"

      - name: Upload SQLite database
        uses: actions/upload-artifact@v4
        with:
          name: media-engine-db-36628871372-1
          path: ${{ github.workspace }}/data/media-engine.db
          if-no-files-found: error
          retention-days: 3
