# Scheduled autonomous media-engine invocation.
#
# Authorized by ADR-0035 (docs/DECISIONS/0035-github-actions-scheduled-trigger-authorization.md).
# Governing ADRs:
#   - ADR-0001: GitHub Actions selected as the scheduler driver architecture.
#   - ADR-0024: single-run protection / overlap prevention (enforced by the
#     entrypoint itself, not by this workflow; a REFUSED invocation exits 3
#     and is treated as a non-failure below).
#   - ADR-0035: authorizes this concrete scheduled trigger, in
#     SIMULATION-only, non-autonomous-publish operation, at a cadence of
#     four runs per day (~every 6 hours).
#
# This workflow does NOT authorize LIVE mode, real external publication, or
# any change to pipeline-stage semantics. It only triggers the existing,
# already-governed entrypoint on a schedule. See ADR-0035 §4 for the full
# authorization boundary.

name: Scheduled Autonomous Run

on:
  schedule:
    # TEMPORARY free-tier operating profile: ONE invocation per day, down from
    # the four-per-day cadence ADR-0035 §7 describes (every ~6 hours). The
    # Owner currently has no paid Gemini API budget, and the free tier allows
    # 15 requests/minute and 500 requests/day for gemini-3.5-flash-lite. Restore
    # '0 0,6,12,18 * * *' (and remove DISCOVERY_FRESH_EVALUATION_BUDGET below)
    # once paid quota is available. Manual runs stay available via
    # workflow_dispatch.
    - cron: '0 6 * * *'
  # Allows an Owner to trigger a run manually from the Actions tab for
  # verification purposes, without changing the automatic cadence above.
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref/branch to check out for manual runs'
        required: false
        type: string
        default: ''

# Only one scheduled run should be in flight from this workflow at a time.
# This is a GitHub-Actions-level concurrency guard and is independent of,
# and in addition to, the application-level single-run protection in
# ADR-0024 (the entrypoint's own system_runs guard). Neither replaces the
# other.
concurrency:
  group: autonomous-scheduled-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # Bound a hung run (e.g. a retrieval body that never completes) so it
    # cannot hold the concurrency group for GitHub's 6-hour default. A
    # timeout is a cancellation: it can leave a RUNNING guard row that makes
    # later runs refuse with exit 3 until it is reclaimed (ADR-0024); see the
    # "Reclaim Orphaned Autonomous Guard" workflow. A healthy free-tier run
    # takes ~20 minutes.
    timeout-minutes: 60
    # ADR-0035 §4.1: execution is explicitly pinned to the safe operating
    # configuration. These are set here, not left to defaults, so the safe
    # configuration is visible in the workflow file itself.
    env:
      RUN_MODE: SIMULATION
      AUTONOMOUS_ENABLED: 'false'
      LLM_PROVIDER_PRIORITY: 'gemini-free'
      # TEMPORARY free-tier operating profile (see the cron comment above):
      # cap fresh Discovery evaluations (2 Gemini calls each) at 5 per run so a
      # run stays within the Gemini free-tier request limits. Applies to this
      # workflow only; the application default in src/config/index.js is
      # unchanged. Candidates not evaluated this run are picked up by later
      # runs via the discovery evaluation schedule.
      DISCOVERY_FRESH_EVALUATION_BUDGET: '5'
      # ADR-0036: publicly-authorized Discovery RSS sources (not secret
      # configuration — public feed URLs).
      RSS_FEED_URLS: 'https://openai.com/news/rss.xml,https://blog.google/technology/ai/rss/,https://techcrunch.com/category/artificial-intelligence/feed/,https://arstechnica.com/ai/feed/'
      SQLITE_PATH: ${{ github.workspace }}/data/media-engine.db
      # Run-state filesystem artifacts carried between runs ALONGSIDE the
      # SQLite file (see "Restore run-state cache" below). Persisted database
      # rows hold absolute paths into these directories (media_artifacts,
      # short_form_media_artifacts, assets.location), so a later run can only
      # use that state if the files are restored at the same paths. Explicit
      # here, rather than left to the application's REPO_ROOT / os.tmpdir()
      # defaults, so the persisted state is visible in this file.
      #   MEDIA_ARTIFACTS_DIR  narration.wav, video.mp4, short-form .mp4, thumbnail.png
      #   ASSET_DOWNLOAD_DIR   downloaded Pixabay assets (needed to render any
      #                        item that has not rendered yet)
      # Deliberately NOT persisted: data/artifacts (production manifest files;
      # no later stage reads them -- the manifest is read from the database).
      MEDIA_ARTIFACTS_DIR: ${{ github.workspace }}/data/media_artifacts
      ASSET_DOWNLOAD_DIR: ${{ github.workspace }}/data/asset_downloads
      # Diagnostic tracing (src/diagnostics/trace.js) -- temporary, for one-off
      # Tavily live-validation observability. Inert unless 'true'; adds
      # BEGIN/END/HEARTBEAT lines to stderr, no behavior change.
      DIAGNOSTIC_TRACE: 'true'
      # Optional provider credentials (ADR-0035 §6). The engine's default
      # R0 operating mode (ADR-0001) does not require any of these to run;
      # if a secret is not configured, the corresponding provider is simply
      # unavailable and the pipeline continues without it.
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      GEMINI_FREE_API_KEY: ${{ secrets.GEMINI_FREE_API_KEY }}
      # YouTube/Facebook publication credentials, wired here so a future
      # deliberate LIVE run does not additionally require a workflow edit.
      # Referencing these secrets does NOT by itself authorize publication:
      # RUN_MODE stays SIMULATION and AUTONOMOUS_ENABLED stays 'false' above
      # (unchanged by this edit), and a real publish additionally requires a
      # per-content-version entry in config/authorized_external_actions.json
      # (ADR-0008/ADR-0030). This narrows the exclusion ADR-0035 §6
      # previously documented for YouTube; TikTok credentials remain
      # deliberately unwired since TikTok is parked and excluded from
      # PUBLICATION_PROVIDER_PRIORITY for this V1 run. NOTE: ADR-0035's own
      # text should be updated by the Owner to reflect this narrowed
      # exclusion — that update is not made here (docs/ADR changes are
      # outside this patch's scope) and is called out under Remaining
      # Pre-Run Requirements.
      PUBLICATION_PROVIDER_PRIORITY: 'youtube_shorts,facebook_reels'
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
      FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install espeak-ng (required by Media Production narration; see README)
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng

      - name: Install dependencies
        run: npm ci

      - name: Prepare run-state directories
        # Created up front so every cached path always exists: a run that
        # produces no media then saves a valid (empty-directory) entry instead
        # of tripping actions/cache's missing-path validation.
        run: |
          mkdir -p "$(dirname "$SQLITE_PATH")" "$MEDIA_ARTIFACTS_DIR" "$ASSET_DOWNLOAD_DIR"

      - name: Restore run-state cache (SQLite + generated media)
        # SQLite state persistence between GitHub Actions runs.
        #
        # The cache is ONLY a carrier of data/media-engine.db from one runner
        # to the next; it is not a permanent or authoritative external
        # database. Entries are evicted by GitHub after 7 days without access
        # (or under the repository cache size limit), and are scoped to the
        # branch that saved them (a branch can restore its own caches and its
        # base/default branch's). A miss is therefore always survivable: the
        # entrypoint simply starts from a fresh database.
        #
        # Every save uses a unique key (run id + attempt) because cache
        # entries are immutable; restore-keys selects the most recently
        # created entry with the shared prefix.
        #
        # The cached SQLite file is exactly the job-level SQLITE_PATH -- the
        # same convention src/config/index.js reads -- so the restored file is
        # the one the entrypoint opens. Only the main database file is cached:
        # it is saved after a TRUNCATE WAL checkpoint (see the checkpoint step
        # below), so -wal / -shm carry no state.
        #
        # The generated filesystem artifacts the database rows point at travel
        # in the SAME cache entry (one key, one restore, one save), so the
        # database and the files it references can never be restored from
        # different runs. Invariant: if SQLite says an item is ready for a later
        # stage, every local file that stage needs is restored with it. Absolute
        # paths are preserved, and the runner workspace path is identical
        # across runs of this repository, so stored paths resolve unchanged.
        #
        # NOTE: actions/cache scopes entries by (paths, compression) as well as
        # key. The first run after the path list changed (this edit) therefore
        # reports a MISS against older DB-only entries and starts from a fresh
        # database; later runs hit normally.
        id: sqlite_cache_restore
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.SQLITE_PATH }}
            ${{ env.MEDIA_ARTIFACTS_DIR }}
            ${{ env.ASSET_DOWNLOAD_DIR }}
          key: media-engine-sqlite-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            media-engine-sqlite-

      - name: Report SQLite cache restore result
        # Makes hit/miss explicit in the log. With restore-keys, the action's
        # `cache-hit` output is only 'true' for an exact key match (which a
        # unique per-run key never produces), so a prefix restore is detected
        # through `cache-matched-key`, which is set whenever any cache was
        # restored and empty on a miss.
        env:
          CACHE_HIT: ${{ steps.sqlite_cache_restore.outputs.cache-hit }}
          CACHE_MATCHED_KEY: ${{ steps.sqlite_cache_restore.outputs.cache-matched-key }}
        run: |
          if [ -n "$CACHE_MATCHED_KEY" ]; then
            echo "SQLite cache: HIT (matched key: $CACHE_MATCHED_KEY; exact-key hit: ${CACHE_HIT:-false})"
            if [ -f "$SQLITE_PATH" ]; then
              echo "Restored database at SQLITE_PATH=$SQLITE_PATH ($(wc -c < "$SQLITE_PATH") bytes)"
            else
              echo "::warning::SQLite cache reported a hit but no file exists at SQLITE_PATH=$SQLITE_PATH"
            fi
          else
            echo "SQLite cache: MISS (no cache matched prefix media-engine-sqlite-); the entrypoint will create a fresh database at SQLITE_PATH=$SQLITE_PATH"
          fi

      - name: Verify restored run state (report only)
        # Attributes any database/filesystem divergence to the RESTORE rather
        # than to this run. Never fails the job and never repairs anything:
        # a divergence it reports is a persisted-state problem, not something
        # to be hidden by re-rendering.
        run: node scripts/check-persisted-state-integrity.js --report-only

      - name: Run autonomous entrypoint (SIMULATION)
        # Exit code 3 (REFUSED_EXIT_CODE, src/index.js) means another
        # invocation already holds the ADR-0024 single-run guard. That is
        # expected, safe behavior under this cadence — the guard correctly
        # doing its job — not a workflow failure, so it is not treated as
        # one. Any other non-zero exit is a genuine failure, but this step
        # itself must not fail here: GitHub Actions' default shell runs
        # with `set -e`, which would otherwise terminate the step on
        # node's non-zero exit before `$?` could be read, and would skip
        # the diagnostic step below entirely. `set +e` is used around the
        # invocation to capture the exit code reliably; `set -e` is
        # restored immediately after. The captured code is exposed as a
        # step output and only re-emitted as the job's real failure by the
        # "Report application exit status" step below, after the
        # diagnostic step (and whatever SQLite checkpoint/persistence
        # src/index.js already performed before exiting) has had a chance
        # to run.
        id: run_app
        run: |
          set +e
          node src/index.js
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 3 ]; then
            echo "Invocation refused: another run already holds the ADR-0024 single-run guard. Treating as expected, not a failure."
          elif [ "$code" -ne 0 ]; then
            echo "::warning::node src/index.js exited with code $code; continuing to diagnostic/persistence steps before failing the workflow."
          fi

      - name: Research source-level diagnostic
        run: node scripts/research-source-diagnostic.js

      - name: Checkpoint SQLite WAL before saving
        # Persists SQLite state for the next run. This step and the save step
        # after it run under always(), so they execute whether or not an
        # earlier step failed. The entrypoint step never fails on the
        # application's exit code (it only records it), so a non-zero
        # application exit still reaches here and its database state is
        # still saved; the job's real pass/fail decision remains the final
        # step below.
        #
        # The database runs in WAL mode (SqliteStorageDriver), so committed
        # data may still live only in data/media-engine.db-wal. Only the main
        # file is cached, so the WAL is folded into it and truncated first.
        # If the checkpoint cannot complete (busy != 0) or the node command
        # fails for any reason, the failure is handled explicitly (not left
        # to bash -e): the step writes saveable=false, exits 1, and never
        # reaches the saveable=true line, so an incomplete file is never
        # saved over a good cache entry.
        id: sqlite_checkpoint
        if: always()
        run: |
          if [ ! -f "$SQLITE_PATH" ]; then
            echo "::warning::No SQLite database at SQLITE_PATH=$SQLITE_PATH; nothing to checkpoint or save."
            echo "saveable=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! node --input-type=module - <<'NODE'
          import Database from 'better-sqlite3';
          const db = new Database(process.env.SQLITE_PATH, { fileMustExist: true });
          try {
            const [r] = db.pragma('wal_checkpoint(TRUNCATE)');
            console.log(`[sqlite-persistence] wal_checkpoint(TRUNCATE): busy=${r.busy} wal_frames=${r.log} checkpointed_frames=${r.checkpointed}`);
            if (r.busy !== 0) {
              console.error('[sqlite-persistence] checkpoint did not complete (database busy); refusing to save.');
              process.exitCode = 1;
            }
          } finally {
            db.close();
          }
          NODE
          then
            echo "::error::SQLite WAL checkpoint did not complete for SQLITE_PATH=$SQLITE_PATH; failing this step and NOT saving the cache."
            echo "saveable=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "[sqlite-persistence] database ready to save: $SQLITE_PATH ($(wc -c < "$SQLITE_PATH") bytes)"
          echo "saveable=true" >> "$GITHUB_OUTPUT"

      - name: Verify persisted state integrity before save
        # Runs only once the WAL checkpoint has completed (saveable=true). Fails
        # -- and withholds the cache save -- only when persisted state and
        # required filesystem state DISAGREE (e.g. a media_artifacts row whose
        # file is missing or empty, or whose bytes no longer match the recorded
        # checksum). A run that produced nothing is healthy and saves normally.
        # Read-only: it never re-renders or fabricates a missing artifact.
        # set +e / explicit exit so the outcome is recorded as a step output
        # for the save step's condition while the step itself still fails red.
        id: state_integrity
        if: always() && steps.sqlite_checkpoint.outputs.saveable == 'true'
        run: |
          set +e
          node scripts/check-persisted-state-integrity.js
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "consistent=true" >> "$GITHUB_OUTPUT"
          else
            echo "consistent=false" >> "$GITHUB_OUTPUT"
            echo "::error::Persisted-state integrity check failed (exit $code); NOT saving the run-state cache over the last consistent entry."
            exit "$code"
          fi

      - name: Save run-state cache (SQLite + generated media)
        # Saved only when ALL required state is ready: the WAL checkpoint
        # completed AND the database and filesystem artifacts agree.
        if: always() && steps.sqlite_checkpoint.outputs.saveable == 'true' && steps.state_integrity.outputs.consistent == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.SQLITE_PATH }}
            ${{ env.MEDIA_ARTIFACTS_DIR }}
            ${{ env.ASSET_DOWNLOAD_DIR }}
          key: media-engine-sqlite-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Report application exit status
        # Runs even if a prior step above failed, so the real application
        # exit code (captured before any diagnostic/persistence step ran)
        # is always the thing that finally determines job success/failure.
        # Exit code 3 (ADR-0024 refusal) and 0 are treated as success;
        # every other non-zero code is re-emitted here, not swallowed.
        if: always()
        run: |
          code="${{ steps.run_app.outputs.code }}"
          if [ -z "$code" ] || [ "$code" -eq 0 ] || [ "$code" -eq 3 ]; then
            exit 0
          fi
          echo "Failing workflow: node src/index.js exited with code $code"
          exit "$code"
