# Scheduled autonomous media-engine invocation.
#
# Authorized by ADR-0035 (docs/DECISIONS/0035-github-actions-scheduled-trigger-authorization.md).
# Governing ADRs:
#   - ADR-0001: GitHub Actions selected as the scheduler driver architecture.
#   - ADR-0024: single-run protection / overlap prevention (enforced by the
#     entrypoint itself, not by this workflow; a REFUSED invocation exits 3
#     and is treated as a non-failure below).
#   - ADR-0035: authorizes this concrete scheduled trigger, in
#     SIMULATION-only, non-autonomous-publish operation, at a cadence of
#     four runs per day (~every 6 hours).
#
# This workflow does NOT authorize LIVE mode, real external publication, or
# any change to pipeline-stage semantics. It only triggers the existing,
# already-governed entrypoint on a schedule. See ADR-0035 §4 for the full
# authorization boundary.

name: Scheduled Autonomous Run

on:
  schedule:
    # Four invocations per day, approximately every 6 hours (ADR-0035 §7).
    - cron: '0 0,6,12,18 * * *'
  # Allows an Owner to trigger a run manually from the Actions tab for
  # verification purposes, without changing the automatic cadence above.
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref/branch to check out for manual runs'
        required: false
        type: string
        default: ''

# Only one scheduled run should be in flight from this workflow at a time.
# This is a GitHub-Actions-level concurrency guard and is independent of,
# and in addition to, the application-level single-run protection in
# ADR-0024 (the entrypoint's own system_runs guard). Neither replaces the
# other.
concurrency:
  group: autonomous-scheduled-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # ADR-0035 §4.1: execution is explicitly pinned to the safe operating
    # configuration. These are set here, not left to defaults, so the safe
    # configuration is visible in the workflow file itself.
    env:
      RUN_MODE: SIMULATION
      AUTONOMOUS_ENABLED: 'false'
      LLM_PROVIDER_PRIORITY: 'groq-free,gemini-free'
      # ADR-0036: publicly-authorized Discovery RSS sources (not secret
      # configuration — public feed URLs).
      RSS_FEED_URLS: 'https://openai.com/news/rss.xml,https://blog.google/technology/ai/rss/,https://techcrunch.com/category/artificial-intelligence/feed/,https://arstechnica.com/ai/feed/'
      SQLITE_PATH: ${{ github.workspace }}/data/media-engine.db
      # Optional provider credentials (ADR-0035 §6). The engine's default
      # R0 operating mode (ADR-0001) does not require any of these to run;
      # if a secret is not configured, the corresponding provider is simply
      # unavailable and the pipeline continues without it. YouTube OAuth
      # credentials are deliberately never referenced here — real
      # publication is not authorized by ADR-0035.
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      GROQ_FREE_API_KEY: ${{ secrets.GROQ_FREE_API_KEY }}
      GEMINI_FREE_API_KEY: ${{ secrets.GEMINI_FREE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install espeak-ng (required by Media Production narration; see README)
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng

      - name: Install dependencies
        run: npm ci

      - name: Restore SQLite state cache
        # SQLite state persistence between GitHub Actions runs.
        #
        # The cache is ONLY a carrier of data/media-engine.db from one runner
        # to the next; it is not a permanent or authoritative external
        # database. Entries are evicted by GitHub after 7 days without access
        # (or under the repository cache size limit), and are scoped to the
        # branch that saved them (a branch can restore its own caches and its
        # base/default branch's). A miss is therefore always survivable: the
        # entrypoint simply starts from a fresh database.
        #
        # Every save uses a unique key (run id + attempt) because cache
        # entries are immutable; restore-keys selects the most recently
        # created entry with the shared prefix.
        #
        # The cached file is exactly the job-level SQLITE_PATH -- the same
        # convention src/config/index.js reads -- so the restored file is the
        # one the entrypoint opens. Only the main database file
        # is cached: it is saved after a TRUNCATE WAL checkpoint (see the
        # checkpoint step below), so -wal / -shm carry no state.
        id: sqlite_cache_restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.SQLITE_PATH }}
          key: media-engine-sqlite-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            media-engine-sqlite-

      - name: Report SQLite cache restore result
        # Makes hit/miss explicit in the log. With restore-keys, the action's
        # `cache-hit` output is only 'true' for an exact key match (which a
        # unique per-run key never produces), so a prefix restore is detected
        # through `cache-matched-key`, which is set whenever any cache was
        # restored and empty on a miss.
        env:
          CACHE_HIT: ${{ steps.sqlite_cache_restore.outputs.cache-hit }}
          CACHE_MATCHED_KEY: ${{ steps.sqlite_cache_restore.outputs.cache-matched-key }}
        run: |
          if [ -n "$CACHE_MATCHED_KEY" ]; then
            echo "SQLite cache: HIT (matched key: $CACHE_MATCHED_KEY; exact-key hit: ${CACHE_HIT:-false})"
            if [ -f "$SQLITE_PATH" ]; then
              echo "Restored database at SQLITE_PATH=$SQLITE_PATH ($(wc -c < "$SQLITE_PATH") bytes)"
            else
              echo "::warning::SQLite cache reported a hit but no file exists at SQLITE_PATH=$SQLITE_PATH"
            fi
          else
            echo "SQLite cache: MISS (no cache matched prefix media-engine-sqlite-); the entrypoint will create a fresh database at SQLITE_PATH=$SQLITE_PATH"
          fi

      - name: Run autonomous entrypoint (SIMULATION)
        # Exit code 3 (REFUSED_EXIT_CODE, src/index.js) means another
        # invocation already holds the ADR-0024 single-run guard. That is
        # expected, safe behavior under this cadence — the guard correctly
        # doing its job — not a workflow failure, so it is not treated as
        # one. Any other non-zero exit is a genuine failure, but this step
        # itself must not fail here: GitHub Actions' default shell runs
        # with `set -e`, which would otherwise terminate the step on
        # node's non-zero exit before `$?` could be read, and would skip
        # the diagnostic step below entirely. `set +e` is used around the
        # invocation to capture the exit code reliably; `set -e` is
        # restored immediately after. The captured code is exposed as a
        # step output and only re-emitted as the job's real failure by the
        # "Report application exit status" step below, after the
        # diagnostic step (and whatever SQLite checkpoint/persistence
        # src/index.js already performed before exiting) has had a chance
        # to run.
        id: run_app
        run: |
          set +e
          node src/index.js
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 3 ]; then
            echo "Invocation refused: another run already holds the ADR-0024 single-run guard. Treating as expected, not a failure."
          elif [ "$code" -ne 0 ]; then
            echo "::warning::node src/index.js exited with code $code; continuing to diagnostic/persistence steps before failing the workflow."
          fi

      - name: Research source-level diagnostic
        run: node scripts/research-source-diagnostic.js

      - name: Checkpoint SQLite WAL before saving
        # Persists SQLite state for the next run. This step and the save step
        # after it run under always(), so they execute whether or not an
        # earlier step failed. The entrypoint step never fails on the
        # application's exit code (it only records it), so a non-zero
        # application exit still reaches here and its database state is
        # still saved; the job's real pass/fail decision remains the final
        # step below.
        #
        # The database runs in WAL mode (SqliteStorageDriver), so committed
        # data may still live only in data/media-engine.db-wal. Only the main
        # file is cached, so the WAL is folded into it and truncated first.
        # If the checkpoint cannot complete (busy != 0) or the node command
        # fails for any reason, the failure is handled explicitly (not left
        # to bash -e): the step writes saveable=false, exits 1, and never
        # reaches the saveable=true line, so an incomplete file is never
        # saved over a good cache entry.
        id: sqlite_checkpoint
        if: always()
        run: |
          if [ ! -f "$SQLITE_PATH" ]; then
            echo "::warning::No SQLite database at SQLITE_PATH=$SQLITE_PATH; nothing to checkpoint or save."
            echo "saveable=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! node --input-type=module - <<'NODE'
          import Database from 'better-sqlite3';
          const db = new Database(process.env.SQLITE_PATH, { fileMustExist: true });
          try {
            const [r] = db.pragma('wal_checkpoint(TRUNCATE)');
            console.log(`[sqlite-persistence] wal_checkpoint(TRUNCATE): busy=${r.busy} wal_frames=${r.log} checkpointed_frames=${r.checkpointed}`);
            if (r.busy !== 0) {
              console.error('[sqlite-persistence] checkpoint did not complete (database busy); refusing to save.');
              process.exitCode = 1;
            }
          } finally {
            db.close();
          }
          NODE
          then
            echo "::error::SQLite WAL checkpoint did not complete for SQLITE_PATH=$SQLITE_PATH; failing this step and NOT saving the cache."
            echo "saveable=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "[sqlite-persistence] database ready to save: $SQLITE_PATH ($(wc -c < "$SQLITE_PATH") bytes)"
          echo "saveable=true" >> "$GITHUB_OUTPUT"

      - name: Save SQLite state cache
        if: always() && steps.sqlite_checkpoint.outputs.saveable == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.SQLITE_PATH }}
          key: media-engine-sqlite-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Report application exit status
        # Runs even if a prior step above failed, so the real application
        # exit code (captured before any diagnostic/persistence step ran)
        # is always the thing that finally determines job success/failure.
        # Exit code 3 (ADR-0024 refusal) and 0 are treated as success;
        # every other non-zero code is re-emitted here, not swallowed.
        if: always()
        run: |
          code="${{ steps.run_app.outputs.code }}"
          if [ -z "$code" ] || [ "$code" -eq 0 ] || [ "$code" -eq 3 ]; then
            exit 0
          fi
          echo "Failing workflow: node src/index.js exited with code $code"
          exit "$code"
